[project]
name = "resume-tailor"
version = "0.1.0"
description = "Tailor a .docx CV to a job description with Gemini agents while keeping layout and never inventing skills."
readme = "docs/PRD.md"
requires-python = ">=3.14"
dependencies = [
    "streamlit",
    "python-docx",
    "google-genai",
    "pydantic",
    "python-dotenv",
    "rapidfuzz",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["resume_tailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `uv run pytest` is deterministic and offline; `uv run pytest -m live` calls Gemini.
addopts = "-m 'not live'"
markers = [
    "live: calls the real Gemini API; skipped when GEMINI_API_KEY is not set",
]
